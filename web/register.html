<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protect your brand</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Protect your brand</h1>
    <p class="lead">Register your domains. We confirm your email, then send your API key. Alerts go to that address.</p>
    <form id="form-register">
      <label for="company_name">Company name</label>
      <input id="company_name" required maxlength="120">
      <label for="email">Email (we send a verification link)</label>
      <input id="email" type="email" required maxlength="254">
      <label for="contact_person">Contact person (optional)</label>
      <input id="contact_person" maxlength="120">
      <label for="domains">Domains to protect (one per line)</label>
      <textarea id="domains" rows="4" required placeholder="abcbank.com"></textarea>
      <label for="aliases">Brand names (comma-separated, optional)</label>
      <input id="aliases" maxlength="500" placeholder="abcbank, abc bank">
      <button type="submit">Register</button>
    </form>
    <div id="results" aria-live="polite"></div>
    <p class="fine"><a href="/">Back to the checker</a></p>
  </main>
  <script src="/static/register.js"></script>
</body>
</html>
